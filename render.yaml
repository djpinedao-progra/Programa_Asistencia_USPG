# Configuración temporal gratuita para una ejecución de hasta 15 días.
services:
  - type: web
    name: programa-asistencia-uspg
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: python prepare_production.py && gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: programa-asistencia-uspg-db
          property: connectionString
      - key: APP_TIMEZONE
        value: America/Guatemala
      - key: ATTENDANCE_CLOSE_GRACE_MINUTES
        value: 30
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: programa-asistencia-uspg-db
    plan: free
    region: virginia
    databaseName: asistencia_uspg
    user: uspg
    ipAllowList: []
